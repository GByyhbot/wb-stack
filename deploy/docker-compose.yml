name: wb-stack

services:
  wb:
    image: wb-single:latest
    container_name: wb-single
    restart: unless-stopped
    pull_policy: never
    ports:
      - "8300:8300"
      - "8310:8310"
    environment:
      WB_BASIC_USER: ${MANAGER_USER}
      WB_BASIC_PASSWORD: ${MANAGER_PASSWORD}
      WB_ROTATOR_KEY: ${ROTATOR_KEY}
      WB_DB_PATH: /data/manager/wb_manager.db
      WB_ROTATOR_HOME: /data/rotator
      WB_BACKUP_DIR: /data/backup
      # 二期第 1 批：observe 先行；WB_QUOTA_ENABLED=0 为回滚旁路开关
      WB_QUOTA_ENABLED: "1"
      WB_QUOTA_MODE: "observe"
      WB_PORT_MANAGER: "8300"
      WB_PORT_ROTATOR: "8310"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
